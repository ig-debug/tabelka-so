<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabelka SO">
<title>Tabelka SO</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--mute:#5d6672;--line:#d5d9df;--red:#c8102e;--redink:#fff;--ok:#1a7f4b}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2126;--ink:#eceff2;--mute:#9aa3ad;--line:#3a4048;--red:#e0344d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(90px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 10px;min-height:46px}
input:focus{outline:2px solid var(--red);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;cursor:pointer}
button.primary{background:var(--red);color:var(--redink);border-color:var(--red);font-weight:600}
button.link{min-height:36px;border:0;background:none;color:var(--red);padding:0 4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:270px}
.prev{overflow-x:auto;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<main>
  <div class="card" id="inst" hidden><strong>Zainstaluj aplikację</strong><p class="hint" id="insthint" style="margin:4px 0 8px"></p><button class="primary" id="instbtn" style="width:100%" hidden>Dodaj do ekranu głównego</button></div>
  <h1>Tabelka SO</h1>
  <p class="sub">Wpisz dane, kliknij „Kopiuj tabelę” i wklej do maila.</p>

  <div class="card">
    <label for="tech" style="margin-top:0">Technik (zapamiętane w telefonie)</label>
    <input id="tech" autocomplete="name" placeholder="np. Jan Kowalski">
  </div>

  <div id="rows"></div>

  <button id="add" style="width:100%">+ Dodaj kolejny wiersz</button>

  <div class="card" style="margin-top:14px">
    <h2>Podgląd tabeli</h2>
    <div class="prev" id="prev"></div>
    <p class="hint">Puste kolumny zostają w tabeli (tak jak w przykładzie od SGRE).</p>
  </div>

  <div class="card">
    <h2>Wysyłka</h2>
    <label for="to" style="margin-top:0">Do</label>
    <input id="to" type="email" inputmode="email" value="agnieszka.zawiasa.ext@siemensgamesa.com">
    <label for="subj">Temat</label>
    <input id="subj" value="Prośba o SO">
    <div class="row2">
      <button id="copytxt">Kopiuj jako tekst</button>
      <button id="mail">Otwórz maila</button>
    </div>
    <p class="hint">Najpierw „Kopiuj tabelę”, potem „Otwórz maila” i wklej tabelę w treść.</p>
  </div>
</main>

<div class="bar"><button class="primary" id="copy">Kopiuj tabelę</button></div>
<div id="toast" role="status"></div>

<script>
var COLS=[["Notyfikacja","n"],["SO","so"],["Typ pracy","t"],["Wind Farm","wf"],["Turbina","tb"],["Start","d"],["Nazwa SO","nm"],["Technik","tech"]];
var rows=[],KEY="tabelka-so-v1";

function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(s.tech)document.getElementById("tech").value=s.tech;
  if(s.to)document.getElementById("to").value=s.to;
  if(s.subj)document.getElementById("subj").value=s.subj;
  if(s.rows&&s.rows.length)rows=s.rows;}catch(e){}
  if(!rows.length)rows=[blank()];}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tech:val("tech"),to:val("to"),subj:val("subj"),rows:rows}));}catch(e){}}
function val(id){return document.getElementById(id).value.trim();}
function blank(from){return {n:"",so:"",t:from?from.t:"",wf:from?from.wf:"",tb:"",d:from?from.d:"",nm:""};}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");return m?m[3]+"."+m[2]+"."+m[1]:(v||"");}

function render(){
  var box=document.getElementById("rows");box.innerHTML="";
  rows.forEach(function(r,i){
    var c=document.createElement("div");c.className="card";
    c.innerHTML='<h2>Wiersz '+(i+1)+(rows.length>1?'<button class="link" data-del="'+i+'">Usuń</button>':'')+'</h2>'+
    '<div class="grid">'+
    f(i,"t","Typ pracy")+f(i,"wf","Wind Farm")+
    f(i,"tb","Turbina")+fd(i)+'</div>'+f(i,"nm","Nazwa SO")+
    '<details style="margin-top:10px"'+(rows[i].n||rows[i].so?' open':'')+'><summary style="color:var(--mute);font-size:14px;padding:8px 0;cursor:pointer">Opcjonalnie: Notyfikacja i SO</summary>'+
    '<div class="grid">'+f(i,"n","Notyfikacja","numeric")+f(i,"so","SO","numeric")+'</div></details>';
    box.appendChild(c);
  });
  preview();
}
function f(i,k,l,im){return '<div><label>'+l+'</label><input data-i="'+i+'" data-k="'+k+'" value="'+esc(rows[i][k])+'"'+(im?' inputmode="'+im+'"':'')+' autocomplete="off"></div>';}
function fd(i){return '<div><label>Start</label><input type="date" data-i="'+i+'" data-k="d" value="'+esc(rows[i].d)+'"></div>';}

function tableHTML(){
  var th="border:1px solid #000;padding:4px 6px;text-align:left;font-weight:bold;background:#f2f2f2;font-size:12px";
  var td="border:1px solid #000;padding:4px 6px;font-size:12px;height:20px";
  var t=val("tech");
  var h='<table style="border-collapse:collapse;border:1px solid #000;font-family:Arial,sans-serif"><thead><tr>'+
    COLS.map(function(c){return '<th style="'+th+'">'+c[0]+'</th>';}).join("")+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>'+COLS.map(function(c){
      var v=c[1]==="tech"?t:c[1]==="d"?fmtDate(r.d):r[c[1]];
      return '<td style="'+td+'">'+esc(v)+'</td>';}).join("")+'</tr>';
  });
  return h+'</tbody></table>';
}
function tableText(){
  var t=val("tech");
  return [COLS.map(function(c){return c[0];}).join("\t")].concat(rows.map(function(r){
    return COLS.map(function(c){return c[1]==="tech"?t:c[1]==="d"?fmtDate(r.d):r[c[1]];}).join("\t");})).join("\n");
}
function preview(){document.getElementById("prev").innerHTML=tableHTML();}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className="";},2200);}

function fallbackCopy(){
  var p=document.getElementById("prev"),r=document.createRange();r.selectNodeContents(p);
  var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  var ok=false;try{ok=document.execCommand("copy");}catch(e){}
  s.removeAllRanges();return ok;
}
function copyTable(){
  var html=tableHTML(),txt=tableText();
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({
      "text/html":new Blob([html],{type:"text/html"}),
      "text/plain":new Blob([txt],{type:"text/plain"})})])
    .then(function(){toast("Skopiowano tabelę. Wklej do maila.");})
    .catch(function(){toast(fallbackCopy()?"Skopiowano tabelę. Wklej do maila.":"Nie udało się skopiować. Użyj „Kopiuj jako tekst”.");});
  }else{toast(fallbackCopy()?"Skopiowano tabelę. Wklej do maila.":"Nie udało się skopiować. Użyj „Kopiuj jako tekst”.");}
}
function copyText(){
  var txt=tableText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("Skopiowano jako tekst.");},function(){toast("Nie udało się skopiować.");});
  }else{toast("Nie udało się skopiować.");}
}

document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.k){rows[+el.dataset.i][el.dataset.k]=el.value;}
  save();preview();
});
document.addEventListener("click",function(e){
  var d=e.target.dataset;
  if(d&&d.del!==undefined){rows.splice(+d.del,1);save();render();}
});
document.getElementById("add").onclick=function(){rows.push(blank(rows[rows.length-1]));save();render();
  var cards=document.querySelectorAll("#rows .card");cards[cards.length-1].scrollIntoView({behavior:"smooth",block:"start"});};
document.getElementById("copy").onclick=copyTable;
document.getElementById("copytxt").onclick=copyText;
document.getElementById("mail").onclick=function(){
  var to=val("to"),s=val("subj"),t=val("tech");
  var subject=s+(t?" - "+t:"");
  location.href="mailto:"+encodeURIComponent(to).replace("%40","@")+"?subject="+encodeURIComponent(subject);
};

load();render();
var dp=null,inst=document.getElementById("inst"),ib=document.getElementById("instbtn"),ih=document.getElementById("insthint");
var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(!standalone){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  inst.hidden=false;
  ih.textContent=ios?"Kliknij ikonę Udostępnij (kwadrat ze strzałką), potem „Do ekranu początkowego”.":"Kliknij przycisk poniżej. Jeśli się nie pojawi: menu przeglądarki (trzy kropki), potem „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.";
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;ib.hidden=false;});
  ib.onclick=function(){if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;ib.hidden=true;});}};
}
window.addEventListener("appinstalled",function(){inst.hidden=true;});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}

</script>
</body>
</html>
